plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.shedaniel.me/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include(implementation(annotationProcessor('io.github.llamalad7:mixinextras-fabric:0.4.1')))
    modCompileOnly 'maven.modrinth:shulkerboxtooltip:r6EhfuUa'
    if (project.hasProperty('compatShulker')) {
        modRuntimeOnly 'maven.modrinth:shulkerboxtooltip:r6EhfuUa'
        modRuntimeOnly 'me.shedaniel.cloth:cloth-config-fabric:13.0.121'
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'resourceEncoding', filteringCharset
    // Display the mod version exactly; the archive filename also identifies its Minecraft target.
    inputs.property 'version', project.mod_version
    filesMatching('fabric.mod.json') { expand 'version': project.mod_version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}
test { useJUnitPlatform() }
jar {
    from('LICENSE')
    from('THIRD_PARTY_ASSETS.md')
}

tasks.register('exampleResourcePack', Zip) {
    from('examples/resource-pack')
    archiveFileName = "tooltip-studio-example-pack-${project.mod_version}+${project.minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('resourcepacks')
}
tasks.register('decorationResourcePack', Zip) {
    from('examples/decoration-pack')
    archiveFileName = "tooltip-studio-decoration-pack-${project.mod_version}+${project.minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('resourcepacks')
}
tasks.register('advancedDecorationResourcePack', Zip) {
    from('examples/advanced-decoration-pack')
    archiveFileName = "tooltip-studio-advanced-decoration-pack-${project.mod_version}+${project.minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('resourcepacks')
}
tasks.register('segmentedTextResourcePack', Zip) {
    from('examples/segmented-text-pack')
    archiveFileName = "tooltip-studio-segmented-text-pack-${project.mod_version}+${project.minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('resourcepacks')
}

tasks.register('beginnerResourcePack', Zip) {
    from('examples/beginner-pack')
    archiveFileName = "tooltip-studio-beginner-pack-${project.mod_version}+${project.minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('resourcepacks')
}

tasks.register('animatedDecorationResourcePack', Zip) {
    from('examples/animated-decoration-pack')
    archiveFileName = "tooltip-studio-animated-decoration-pack-${project.mod_version}+${project.minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('resourcepacks')
}

tasks.named('assemble') { dependsOn tasks.named('exampleResourcePack'), tasks.named('decorationResourcePack'), tasks.named('advancedDecorationResourcePack'), tasks.named('segmentedTextResourcePack'), tasks.named('beginnerResourcePack'), tasks.named('animatedDecorationResourcePack') }

// Developer-only rendering smoke test; excluded from the distributable jar.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        tooltipstudio { sourceSet sourceSets.main }
        tooltipstudio_smoke { sourceSet sourceSets.smoke }
    }
    runs {
        poster {
            client()
            name 'Tooltip Studio item demo capture'
            source sourceSets.smoke
            vmArg '-Dtooltipstudio.poster=true'
            programArgs '--width', '1280', '--height', '720'
            runDir 'run-smoke'
        }
        smoke {
            client()
            name 'Tooltip Studio rendering smoke test'
            source sourceSets.smoke
            vmArg '-Dtooltipstudio.smoke=true'
            programArgs '--width', '1280', '--height', '900'
            runDir project.findProperty('smokeRunDir') ?: 'run-smoke'
        }
    }
}
