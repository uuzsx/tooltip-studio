plugins {
    id 'fabric-loom' version '1.9.2' apply false
    id 'maven-publish'
}

def targets = [
    '1.20.4': ['1.20.4+build.3', '0.97.2+1.20.4', 'r6EhfuUa', '13.0.121', 22],
    '1.21.1': ['1.21.1+build.3', '0.116.17+1.21.1', 'NSrItCES', '15.0.140', 34],
    '1.21.2': ['1.21.2+build.1', '0.106.1+1.21.2', null, null, 42],
    '1.21.3': ['1.21.3+build.2', '0.114.1+1.21.3', 'lyWqI3Rl', '16.0.143', 42],
    '1.21.4': ['1.21.4+build.8', '0.119.4+1.21.4', 'zZfEoJB1', '17.0.144', 46]
]
allprojects {
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'
    def mc = project == rootProject ? '1.20.4' : project.name.substring(2)
    def target = targets[mc]
    def legacy = mc == '1.20.4'
    ext.minecraftTarget = mc
    version = "${rootProject.mod_version}+${mc}"
    group = rootProject.maven_group
    base { archivesName = rootProject.archives_base_name }
    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository { maven { name = 'FabricModules'; url = 'https://maven.fabricmc.net/' } }
            filter { includeGroupByRegex('net\\.fabricmc.*') }
        }
        exclusiveContent {
            forRepository { maven { name = 'ModrinthMods'; url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup('maven.modrinth') }
        }
        maven { url = 'https://maven.shedaniel.me/' }
    }
    // Remapped dependencies are generated locally by Loom, never published to remote Maven repositories.
    repositories.configureEach { repository ->
        if (repository instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && repository.url.scheme != 'file') {
            repository.content { excludeGroupByRegex('net_fabricmc_yarn_.*') }
        }
    }
    dependencies {
        minecraft "com.mojang:minecraft:${mc}"
        mappings "net.fabricmc:yarn:${target[0]}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.findProperty('loader_version') ?: '0.16.14'}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${target[1]}"
        include(implementation(annotationProcessor('io.github.llamalad7:mixinextras-fabric:0.4.1')))
        if (target[2] != null) {
            modCompileOnly "maven.modrinth:shulkerboxtooltip:${target[2]}"
            if (project.hasProperty('compatShulker') && (!project.hasProperty('mc') || project.property('mc') == mc)) {
                modRuntimeOnly "maven.modrinth:shulkerboxtooltip:${target[2]}"
                if (legacy) modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${target[3]}"
            }
        }
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    sourceSets {
        main {
            java.srcDirs = [rootProject.file('src/main/java'), rootProject.file("src/platform/${legacy ? 'legacy' : 'modern'}/java"), rootProject.file("src/platform/${legacy || mc == '1.21.1' ? 'early' : 'late'}/java")]
            java.srcDir rootProject.file("src/platform/${target[2] == null ? 'no-sbt' : legacy ? 'sbt-legacy' : mc == '1.21.1' ? 'sbt-modern' : 'sbt-late'}/java")
            resources.srcDirs = [rootProject.file('src/main/resources')]
        }
        test {
            java.srcDirs = [rootProject.file('src/test/java'), rootProject.file("src/platform/${legacy ? 'legacy' : 'modern'}/test")]
        }
    }
    processResources {
        filteringCharset = 'UTF-8'
        inputs.properties(version: rootProject.mod_version, minecraft: mc, java: legacy ? 17 : 21, loader_min: legacy ? '0.15.11' : '0.16.14')
        filesMatching('tooltipstudio.mixins.json') { expand(java: legacy ? 17 : 21) }
        filesMatching('fabric.mod.json') { expand(version: rootProject.mod_version, minecraft: mc, java: legacy ? 17 : 21, loader_min: legacy ? '0.15.11' : '0.16.14') }
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = legacy ? 17 : 21 }
    java {
        sourceCompatibility = legacy ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21
        targetCompatibility = legacy ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21
        withSourcesJar()
    }
    test { useJUnitPlatform(); workingDir = rootProject.projectDir }
    jar { from(rootProject.file('LICENSE')); from(rootProject.file('THIRD_PARTY_ASSETS.md')) }
    def packs = [example: 'resource-pack', decoration: 'decoration-pack', advancedDecoration: 'advanced-decoration-pack', segmentedText: 'segmented-text-pack', beginner: 'beginner-pack', animatedDecoration: 'animated-decoration-pack']
    if (!legacy) packs.component = 'component-pack'
    def modernCommandsFile = rootProject.file('examples/modern-commands.json')
    def modernCommands = new groovy.json.JsonSlurper().parse(modernCommandsFile, 'UTF-8')
    packs.each { key, dir ->
        def packTask = tasks.register("${key}ResourcePack", Zip) {
            from(rootProject.file("examples/${dir}"))
            filteringCharset = 'UTF-8'
            inputs.file(modernCommandsFile)
            inputs.properties(mc: mc, modVersion: rootProject.mod_version, packFormat: target[4])
            filesMatching('README.md') {
                filter { line ->
                    def updated = legacy ? line : modernCommands.getOrDefault(line, line)
                    updated = updated.replaceAll(/1\.[0-9]+(?:\.[0-9]+)?\+1\.20\.4/, "${rootProject.mod_version}+${mc}")
                            .replace('Tooltip Studio 1.7', "Tooltip Studio ${rootProject.mod_version}")
                            .replace('Tooltip Studio 1.8', "Tooltip Studio ${rootProject.mod_version}")
                            .replace('（1.8）', "（${rootProject.mod_version}）")
                    if (!legacy) updated = updated.replace('1.20.4', mc).replace('pack_format=22', "pack_format=${target[4]}")
                    updated
                }
            }
            if (!legacy) from(rootProject.file('docs/1.21-components.md')) { into 'docs' }
            filesMatching('pack.mcmeta') { filter { line -> line.replaceAll(/"pack_format": [0-9]+/, '"pack_format": ' + target[4]) } }
            archiveFileName = "tooltip-studio-${dir == 'resource-pack' ? 'example-pack' : dir}-${rootProject.mod_version}+${mc}.zip"
            destinationDirectory = layout.buildDirectory.dir('resourcepacks')
        }
        tasks.named('assemble') { dependsOn packTask }
    }
    if (legacy) apply from: rootProject.file('gradle/legacy-smoke.gradle')
    else apply from: rootProject.file('gradle/modern-smoke.gradle')
}
tasks.register('buildAllVersions') { dependsOn allprojects.collect { it.tasks.named('build') } }
