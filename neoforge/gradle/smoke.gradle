// Isolated developer test mod. No smoke classes are included in the distributed JAR.
sourceSets {
    smoke {
        java.srcDirs = ['src/smoke/java', "src/${minecraftTarget in ['26.2', '26.3'] ? '26.3' : minecraftTarget.startsWith('26.') ? 'modern' : 'classic'}/smoke"]
        resources.srcDirs = ['src/smoke/resources']
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
neoForge {
    addModdingDependenciesTo sourceSets.smoke
    mods { tooltipstudio_smoke { sourceSet sourceSets.smoke } }
    runs {
        client { loadedMods = [mods.tooltipstudio] }
        smoke {
            client()
            sourceSet = sourceSets.smoke
            loadedMods = project.hasProperty('packagedSmoke') ? [mods.tooltipstudio_smoke] : [mods.tooltipstudio, mods.tooltipstudio_smoke]
            gameDirectory = file("run-smoke/${minecraftTarget}")
            systemProperty 'tooltipstudio.mc', minecraftTarget
            def formats = ['1.21.1':34, '1.21.4':46, '26.1.1':84, '26.1.2':84, '26.2':88, '26.3':97]
            def format = formats[minecraftTarget]
            def pack = minecraftTarget.startsWith('26.') ? [description:'Developer smoke', min_format:[format, minecraftTarget == '26.3' ? 1 : 0], max_format:[format, minecraftTarget == '26.3' ? 1 : 0]] : [description:'Developer smoke', pack_format:format]
            systemProperty 'tooltipstudio.packMetadata', groovy.json.JsonOutput.toJson([pack:pack])
            programArguments.addAll '--width', '1280', '--height', '900'
        }
    }
}
if (project.hasProperty('packagedSmoke')) {
    sourceSets.smoke.runtimeClasspath -= sourceSets.main.output
    dependencies { smokeRuntimeOnly files(tasks.named('jar')) }
}
processSmokeResources {
    from('../examples/modern-commands.json')
    if (minecraftTarget.startsWith('26.')) {
        // Since 1.21.5 text components in SNBT are structured objects, no JSON string wrapper.
        filter { line -> line.replace("'{", "{").replace("}'", "}") }
    }
}
